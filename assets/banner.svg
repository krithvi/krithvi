<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b3a5c"/>
      <stop offset="50%" stop-color="#5c4a8c"/>
      <stop offset="100%" stop-color="#2e2f68"/>
    </linearGradient>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="termClip">
      <rect x="150" y="150" width="900" height="224" rx="14"/>
    </clipPath>
  </defs>

  <!-- brand gradient background -->
  <rect width="1200" height="430" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="90" cy="70" r="1" opacity="0.5"/>
    <circle cx="1160" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="1120" cy="90" r="1" opacity="0.5"/>
    <circle cx="60" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="1140" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="400" r="1.3" opacity="0.7"/>
    <circle cx="1170" cy="390" r="1.1" opacity="0.6"/>
    <circle cx="600" cy="18" r="1.2" opacity="0.6"/>
    <circle cx="200" cy="45" r="1" opacity="0.5"/>
    <circle cx="1000" cy="55" r="1.1" opacity="0.5"/>
    <circle cx="80" cy="380" r="1" opacity="0.5"/>
    <circle cx="1090" cy="400" r="1.2" opacity="0.6"/>
  </g>

  <!-- name branding, on the background itself -->
  <text x="600" y="60" font-size="38" fill="#cfe3c9" text-anchor="middle" font-weight="700">
    Kavya Rajendran
  </text>
  <text x="600" y="92" font-size="19" fill="#e8e2f5" text-anchor="middle" opacity="0.9">
    HCC PhD @ UMBC <tspan fill="#a99be0">·</tspan> Affective Computing + Social Computing
  </text>

  <!-- terminal drop shadow -->
  <rect x="150" y="156" width="900" height="224" rx="14" fill="#000000" opacity="0.45" filter="url(#shadowBlur)"/>

  <!-- terminal window -->
  <g clip-path="url(#termClip)">
    <rect x="150" y="150" width="900" height="224" fill="#0d0d0d"/>
    <rect x="150" y="150" width="900" height="34" fill="#171717"/>
    <line x1="150" y1="184" x2="1050" y2="184" stroke="#292929" stroke-width="1"/>
    <text x="600" y="172" font-size="13" fill="#6b6b6b" text-anchor="middle">zsh</text>

    <text x="180" y="225" font-size="22">
      <tspan fill="#a99be0">$</tspan>
      <tspan fill="#e8e2f5"> python hello_friend.py</tspan>
    </text>
    <text x="180" y="265" font-size="22" fill="#cfe3c9">Hello, friend.</text>
    <text x="180" y="305" font-size="22" fill="#a99be0">$</text>
    <rect x="198" y="289" width="12" height="20" fill="#cfe3c9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
